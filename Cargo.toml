[package]
name = "nons-adapter-bilibili"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false
build = "build.rs"

[package.metadata.component]
package = "nons:bilibili"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
md-5 = "0.10"
url = "2"
html-escape = "0.2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.41"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
